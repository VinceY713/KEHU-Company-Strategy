<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>崃州项目 · 交付工作台 Demo</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <div>
      <b>崃州项目 · 交付工作台</b>
      <span class="sub">客湖 KEHU　·　Demo</span>
    </div>
  </div>

  <nav class="views" id="viewNav">
    <button data-view="agenda" class="on">周会工作台</button>
    <button data-view="minutes">纪要回写</button>
    <button data-view="board">看板</button>
    <button data-view="gantt">甘特</button>
    <button data-view="list">全部事项</button>
  </nav>

  <div class="topright">
    <span class="clock" id="clock"></span>
    <button class="ghost" id="btnSnapshot" title="存一份当前状态的快照">快照</button>
    <button class="ghost" id="btnPrint" title="导出为 PDF 或截图">导出</button>
    <button class="ghost danger" id="btnReset" title="恢复种子数据">重置</button>
  </div>
</header>

<div class="healthbar" id="healthbar"></div>

<main id="main"></main>

<!-- 详情抽屉 -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="事项详情"></aside>

<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/rules.js"></script>
<script src="js/minutes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
