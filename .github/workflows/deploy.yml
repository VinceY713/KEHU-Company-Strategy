name: Deploy PlayCARD to xiaohu server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key from secret
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
          HOST: ${{ secrets.ECS_HOST }}
          PORT: ${{ secrets.ECS_PORT }}
          USER: ${{ secrets.ECS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "-- lines: $(wc -l < ~/.ssh/deploy_key) chars: $(wc -c < ~/.ssh/deploy_key)"
          echo "-- BEGIN: $(grep -c 'BEGIN' ~/.ssh/deploy_key) END: $(grep -c 'END' ~/.ssh/deploy_key)"
          echo "-- body line lengths: $(awk 'NR>1 && $0 !~ /^-----/ {printf "%d ", length($0)} END{print ""}' ~/.ssh/deploy_key)"
          python3 -c "
import sys
try:
    from cryptography.hazmat.primitives import serialization
    data = open('/home/runner/.ssh/deploy_key','rb').read()
    k = serialization.load_ssh_private_key(data, password=None)
    pem = k.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.TraditionalOpenSSL, serialization.NoEncryption())
    open('/home/runner/.ssh/deploy_key','wb').write(pem)
    print('KEY_OK_REWRITTEN:', type(k).__name__)
except ImportError:
    print('NO_CRYPTOGRAPHY_LIB')
except Exception as e:
    print('KEY_PARSE_ERROR:', type(e).__name__, str(e)[:100])
" || pip install -q cryptography 2>&1 | tail -1
          echo "HOST=$HOST USER=$USER PORT=${PORT:-22}" >> $GITHUB_ENV

      - name: Probe server environment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p ${PORT:-22} $USER@$HOST '
            echo "== USER: $(whoami) @ $(hostname) ==";
            grep PRETTY /etc/os-release;
            echo "== nginx ==";
            command -v nginx && sudo systemctl is-active nginx 2>/dev/null;
            echo "-- conf.d:"; sudo ls /etc/nginx/conf.d/ 2>/dev/null;
            echo "-- sites-enabled:"; sudo ls /etc/nginx/sites-enabled/ 2>/dev/null;
            echo "-- playcard in nginx:"; sudo grep -rn "playcard" /etc/nginx/ 2>/dev/null | head -5;
            echo "-- xiaohu domain:"; sudo grep -rln "xiaohu" /etc/nginx/ 2>/dev/null;
            echo "== web dirs =="; ls -d /var/www/* 2>/dev/null;
            echo "== port 80 =="; sudo ss -ltnp 2>/dev/null | grep -E ":80 " | head -3;
            echo "== sudo nopasswd =="; sudo -n true 2>/dev/null && echo YES || echo NO;
            echo "== home =="; ls ~ 2>/dev/null | head -8;
          '

      - name: Upload code to server temp dir
        run: |
          rsync -avz --delete --exclude '.git' --exclude '.github' --exclude '.workbuddy' --exclude '.claude' --exclude 'KCS.pem' -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p ${PORT:-22}" ./ $USER@$HOST:/tmp/playcard-deploy/ 2>&1 | tail -6
