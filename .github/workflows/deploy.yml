name: Deploy PlayCARD to xiaohu server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key from secret
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
          HOST: ${{ secrets.ECS_HOST }}
          PORT: ${{ secrets.ECS_PORT }}
          USER: ${{ secrets.ECS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          perl -pi -e 's/^\x{EF}\x{BB}\x{BF}//' ~/.ssh/deploy_key
          awk '/BEGIN/{f=1} f{print} f&&/END/{f=0}' ~/.ssh/deploy_key > ~/.ssh/deploy_key.clean
          mv ~/.ssh/deploy_key.clean ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "PORT=${PORT:-22}" >> $GITHUB_ENV

      - name: Find working SSH user
        run: |
          SSHCMD="ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p ${PORT:-22}"
          FOUND=""
          if $SSHCMD $USER@$HOST 'true' 2>/dev/null; then
            FOUND="$USER"; echo "-- secret user works: $USER"
          else
            for u in root ubuntu lighthouse admin ecs-user centos; do
              if $SSHCMD $u@$HOST 'true' 2>/dev/null; then FOUND="$u"; echo "-- user works: $u"; break; fi
            done
          fi
          if [ -n "$FOUND" ]; then echo "USER_OK=$FOUND" >> $GITHUB_ENV; else echo "::error::No SSH user accepted this key on $HOST"; exit 1; fi

      - name: Upload and install to /var/www/playcard
        run: |
          rsync -avz --delete --exclude '.git' --exclude '.github' --exclude '.workbuddy' --exclude '.claude' --exclude 'KCS.pem' -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p ${PORT:-22}" ./ $USER_OK@$HOST:/tmp/playcard-deploy/ 2>&1 | tail -4
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p ${PORT:-22} $USER_OK@$HOST '
            sudo mkdir -p /var/www/playcard &&
            sudo rsync -a --delete /tmp/playcard-deploy/ /var/www/playcard/ &&
            sudo chown -R root:root /var/www/playcard/ &&
            sudo python3 /tmp/playcard-deploy/scripts/deploy-nginx.py &&
            echo "INSTALL_DONE"'

      - name: Verify online
        run: |
          sleep 2
          for url in "http://xiaohu.kehutech.com/playcard/" "http://${HOST}/playcard/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 "$url" || echo 000)
            echo "GET $url -> $code"
          done
