name: Deploy PlayCARD to xiaohu server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key from secret
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
          HOST: ${{ secrets.ECS_HOST }}
          PORT: ${{ secrets.ECS_PORT }}
          USER: ${{ secrets.ECS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "-- key lines: $(wc -l < ~/.ssh/deploy_key) chars: $(wc -c < ~/.ssh/deploy_key)"
          echo "-- key type: $(grep -o 'BEGIN [A-Za-z ]*PRIVATE KEY' ~/.ssh/deploy_key | head -1 || echo unknown)"
          echo "-- head bytes: $(head -c 24 ~/.ssh/deploy_key | od -An -tx1 | tr -d ' \n')"
          perl -pi -e 's/^\x{EF}\x{BB}\x{BF}//' ~/.ssh/deploy_key
          awk '/BEGIN/{f=1} f{print} f&&/END/{f=0}' ~/.ssh/deploy_key > ~/.ssh/deploy_key.clean
          mv ~/.ssh/deploy_key.clean ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "-- after clean lines: $(wc -l < ~/.ssh/deploy_key)"
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 && echo "-- ssh-keygen OK" || echo "-- ssh-keygen still fails"
          echo "HOST=$HOST USER=$USER PORT=${PORT:-22}" >> $GITHUB_ENV

      - name: Probe server environment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p ${PORT:-22} $USER@$HOST 'echo "== USER: $(whoami) @ $(hostname) =="; grep PRETTY /etc/os-release; echo "== nginx =="; command -v nginx && sudo systemctl is-active nginx 2>/dev/null; echo "-- conf.d:"; sudo ls /etc/nginx/conf.d/ 2>/dev/null; echo "-- sites-enabled:"; sudo ls /etc/nginx/sites-enabled/ 2>/dev/null; echo "-- playcard in nginx:"; sudo grep -rn "playcard" /etc/nginx/ 2>/dev/null | head -5; echo "-- xiaohu domain:"; sudo grep -rln "xiaohu" /etc/nginx/ 2>/dev/null; echo "== web dirs =="; ls -d /var/www/* 2>/dev/null; echo "== port 80 =="; sudo ss -ltnp 2>/dev/null | grep -E ":80 " | head -3; echo "== sudo nopasswd =="; sudo -n true 2>/dev/null && echo YES || echo NO; echo "== home =="; ls ~ 2>/dev/null | head -8'

      - name: Upload code to server temp dir
        run: |
          rsync -avz --delete --exclude '.git' --exclude '.github' --exclude '.workbuddy' --exclude '.claude' --exclude 'KCS.pem' -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p ${PORT:-22}" ./ $USER@$HOST:/tmp/playcard-deploy/ 2>&1 | tail -6
